on:
  request:
    method: POST
    path: /api/scan-watchlists
    auth: admin

jobs:
  scan_watchlists:
    steps:
      # ─────────────────────────────────────────────────────────────
      # 1. Compute the current Eastern-Time hour (server clock is UTC).
      #    ET = UTC-5 (EST) or UTC-4 (EDT). DST ~2nd Sun Mar → 1st Sun Nov.
      #    in_tm_maintenance = ET hour in [2,6) → Ticketmaster's nightly
      #    service window. Handled PER watchlist below (only TM is paused).
      # ─────────────────────────────────────────────────────────────
      - id: clock
        run: sql
        with:
          query: |
            WITH np AS (
              SELECT
                CAST(strftime('%m','now') AS INTEGER) AS mon,
                CAST(strftime('%d','now') AS INTEGER) AS day,
                CAST(strftime('%H','now') AS INTEGER) AS utc_hour
            ),
            dst AS (
              SELECT *,
                CASE
                  WHEN mon BETWEEN 4 AND 10 THEN 1
                  WHEN mon = 3  AND day >= 8 THEN 1
                  WHEN mon = 11 AND day <  7 THEN 1
                  ELSE 0
                END AS is_edt
              FROM np
            )
            SELECT
              utc_hour,
              ((utc_hour - (CASE WHEN is_edt=1 THEN 4 ELSE 5 END)) % 24 + 24) % 24 AS et_hour,
              CASE WHEN ((utc_hour - (CASE WHEN is_edt=1 THEN 4 ELSE 5 END)) % 24 + 24) % 24
                        BETWEEN 2 AND 5 THEN 1 ELSE 0 END AS in_tm_maintenance
            FROM dst

      # ─────────────────────────────────────────────────────────────
      # 2. Active watchlists due for a scan.
      # ─────────────────────────────────────────────────────────────
      - id: watches
        run: sql
        with:
          query: |
            SELECT
              w.id, w.user_id, w.keyword, w.category, w.max_price,
              w.alert_email, w.interval_mins, w.auto_pause, w.auto_purchase,
              bp.tm_api_key, bp.alert_email AS profile_email
            FROM watchlists w
            LEFT JOIN broker_profiles bp ON bp.user_id = w.user_id
            WHERE w.active = 1
              AND (
                w.last_checked = ''
                OR datetime(w.last_checked) <= datetime('now', '-' || w.interval_mins || ' minutes')
              )
            LIMIT 150

      # ─────────────────────────────────────────────────────────────
      # 3. Per watch: stamp cadence, then either pause (maintenance) or scan.
      # ─────────────────────────────────────────────────────────────
      - id: results
        for_each: "${{ steps.watches.outputs.rows }}"
        as: item
        steps:
          # Always stamp last_checked so the cadence holds.
          - run: sql
            with:
              query: "UPDATE watchlists SET last_checked = datetime('now') WHERE id = :wid"
              params:
                wid: "${{ item.id }}"

          # BRANCH A — TM maintenance window AND this watch auto-pauses → log + skip.
          - if: "${{ steps.clock.outputs.first.in_tm_maintenance == 1 && item.auto_pause == 1 }}"
            steps:
              - run: sql
                with:
                  query: |
                    INSERT INTO scan_logs (watchlist_id, user_id, status, results, hits)
                    VALUES (:wid, :uid, 'maintenance', 0, 0)
                  params:
                    wid: "${{ item.id }}"
                    uid: "${{ item.user_id }}"

          # BRANCH B — window clear OR auto_pause off → scan Ticketmaster.
          - if: "${{ steps.clock.outputs.first.in_tm_maintenance == 0 || item.auto_pause == 0 }}"
            steps:
              - id: tm_result
                run: api
                with:
                  url: "https://app.ticketmaster.com/discovery/v2/events.json"
                  method: GET
                  query:
                    apikey: "${{ item.tm_api_key | default:env.TICKETMASTER_API_KEY }}"
                    keyword: "${{ item.keyword }}"
                    classificationName: "${{ item.category | default:'' }}"
                    size: "20"
                    sort: "date,asc"

              # Record each NEW event at/under the price ceiling (max_price 0 = no cap).
              - for_each: "${{ steps.tm_result.outputs._embedded.events | default:[] }}"
                as: ev
                steps:
                  - if: "${{ (item.max_price == 0 || (ev.priceRanges[0].min | default:0) <= item.max_price) && (ev.priceRanges[0].min | default:0) > 0 }}"
                    steps:
                      - run: sql
                        with:
                          query: |
                            INSERT INTO watch_hits
                              (watchlist_id, user_id, event_id, event_name, event_date,
                               venue, city, price, url, source, status, notified)
                            SELECT :wid, :uid, :eid, :ename, :edate, :venue, :city,
                                   :price, :url, 'ticketmaster', 'available', 0
                            WHERE NOT EXISTS (
                              SELECT 1 FROM watch_hits WHERE watchlist_id = :wid AND event_id = :eid
                            )
                          params:
                            wid: "${{ item.id }}"
                            uid: "${{ item.user_id }}"
                            eid: "${{ ev.id | default:'' }}"
                            ename: "${{ ev.name | default:'' }}"
                            edate: "${{ ev.dates.start.localDate | default:'' }}"
                            venue: "${{ ev._embedded.venues[0].name | default:'' }}"
                            city: "${{ ev._embedded.venues[0].city.name | default:'' }}"
                            price: "${{ ev.priceRanges[0].min | default:0 }}"
                            url: "${{ ev.url | default:'' }}"

              # Count the new (un-notified) hits for this watch.
              - id: newhits
                run: sql
                with:
                  query: |
                    SELECT COUNT(*) AS n, MIN(price) AS low_price
                    FROM watch_hits WHERE watchlist_id = :wid AND notified = 0
                  params:
                    wid: "${{ item.id }}"

              # Bump counters.
              - run: sql
                with:
                  query: |
                    UPDATE watchlists SET
                      last_hit = CASE WHEN :n > 0 THEN datetime('now') ELSE last_hit END,
                      last_hit_price = CASE WHEN :n > 0 THEN :low ELSE last_hit_price END,
                      hits_today = hits_today + :n,
                      hit_total  = hit_total  + :n
                    WHERE id = :wid
                  params:
                    wid: "${{ item.id }}"
                    n: "${{ steps.newhits.outputs.first.n }}"
                    low: "${{ steps.newhits.outputs.first.low_price | default:0 }}"

              # Log the scan with real counts.
              - run: sql
                with:
                  query: |
                    INSERT INTO scan_logs (watchlist_id, user_id, status, results, hits)
                    VALUES (:wid, :uid, 'ok', :results, :hits)
                  params:
                    wid: "${{ item.id }}"
                    uid: "${{ item.user_id }}"
                    results: "${{ steps.tm_result.outputs._embedded.events | length | default:0 }}"
                    hits: "${{ steps.newhits.outputs.first.n }}"

              # Alert email when there are new hits and a destination.
              - if: "${{ steps.newhits.outputs.first.n > 0 }}"
                steps:
                  - id: hitrows
                    run: sql
                    with:
                      query: |
                        SELECT event_name, event_date, venue, city, price, url
                        FROM watch_hits WHERE watchlist_id = :wid AND notified = 0
                        ORDER BY price ASC LIMIT 10
                      params:
                        wid: "${{ item.id }}"
                  - run: email
                    with:
                      to: "${{ item.alert_email | default:item.profile_email | default:'' }}"
                      subject: "🎟️ TicketSpin: matches for '${{ item.keyword }}' under $${{ item.max_price }}"
                      template: watch_alert
                      data:
                        keyword: "${{ item.keyword }}"
                        max_price: "${{ item.max_price }}"
                        count: "${{ steps.newhits.outputs.first.n }}"
                        auto_purchase: "${{ item.auto_purchase }}"
                        hits: "${{ steps.hitrows.outputs.rows }}"
                  - run: sql
                    with:
                      query: "UPDATE watch_hits SET notified = 1 WHERE watchlist_id = :wid AND notified = 0"
                      params:
                        wid: "${{ item.id }}"

      - run: respond
        with:
          status: 200
          json:
            ok: true
            scanned: "${{ steps.watches.outputs.rows | length }}"
            et_hour: "${{ steps.clock.outputs.first.et_hour }}"
            tm_maintenance: "${{ steps.clock.outputs.first.in_tm_maintenance }}"
