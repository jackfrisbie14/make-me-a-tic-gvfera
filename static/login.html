<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – TicketSpin</title>
  <script src="/_internal/tailwind.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-violet-600 shadow-lg shadow-violet-900/50 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">TicketSpin</h1>
      <p class="text-sm text-zinc-500 mt-1">Broker Intelligence Platform</p>
    </div>
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-7 shadow-xl">
      <h2 class="text-lg font-semibold mb-5">Sign in</h2>
      <div id="error-msg" class="hidden mb-4 px-3 py-2 rounded-lg bg-red-900/30 border border-red-800/50 text-red-300 text-sm"></div>
      <form method="POST" id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-zinc-500 mb-1.5">Email</label>
          <input id="email" type="email" placeholder="you@brokerage.com" autocomplete="email"
            class="w-full px-3 py-2.5 rounded-lg border border-zinc-700 bg-zinc-800 text-zinc-100 placeholder-zinc-600 text-sm focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500/40" />
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wide text-zinc-500 mb-1.5">Password</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password"
            class="w-full px-3 py-2.5 rounded-lg border border-zinc-700 bg-zinc-800 text-zinc-100 placeholder-zinc-600 text-sm focus:outline-none focus:border-violet-500 focus:ring-1 focus:ring-violet-500/40" />
        </div>
        <button type="submit" id="submit-btn"
          class="w-full py-2.5 rounded-xl bg-violet-600 hover:bg-violet-500 active:scale-95 text-white font-semibold text-sm transition-all duration-150 disabled:opacity-50">
          Sign In
        </button>
      </form>
      <p class="mt-5 text-center text-sm text-zinc-600">
        No account? <a href="/signup.html" class="text-violet-400 hover:text-violet-300">Sign up free</a>
      </p>
    </div>
  </div>
  <script type="module" src="/static/login.js"></script>
</body>
</html>
